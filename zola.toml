# Site settings. Built with Zola 0.23.6 (https://www.getzola.org).

# The live address: the custom domain on Cloudflare Pages project `akira-shirase-oss` (see README "Publishing").
# `zola serve` ignores it and uses http://127.0.0.1:1111 for local previews.
base_url = "https://404human.dev"

title = "404human"
description = "Building Rust runtimes, reliable background jobs, and AI infrastructure. Sharing the experiments, failures, and releases."
default_language = "en"

# The default author of every post (footer and RSS feed).
author = "404human"

# An RSS feed at /rss.xml so people can follow new posts (linked in the page head for feed readers),
# and /llms.txt, the site in brief for AI assistants (templates/llms.txt), built the same way.
generate_feeds = true
feed_filenames = ["rss.xml", "llms.txt"]

# /sitemap.xml lists every page for search engines, and /robots.txt points them to it.
generate_sitemap = true
generate_robots_txt = true

[markdown]
# Curly quotes and proper dashes in posts (code is left alone).
smart_punctuation = true

[markdown.highlighting]
# Code colours follow the reader's light or dark mode.
light_theme = "github-light"
dark_theme = "github-dark"
# Fail the build on a typo in a code block's language name.
error_on_missing_language = true
# Let code colours follow the page's light/dark setting (so the toggle switches them too).
add_color_scheme = false

[extra]
# The home page's title in search results and tabs: "404human · <tagline>" (60 characters at most).
tagline = "Rust runtimes, background jobs, AI infrastructure"
# Describes the link-preview image (static/img/social-card.jpg) for people who can't see it.
card_alt = "404human: hey, I break things. A clay figure thinking at a laptop."
# Contact links on the home page. Fill in the ones you want; empty ones are hidden.
# X handle without the @ (also used for link previews on X).
x_handle = "404humandev"
# GitHub username.
github = "akira-shirase-oss"
# Email address (shown on the page, so use one you're happy to make public).
email = ""

# Website · Docs · Source for each project, keyed by its build-log folder —
# one line per URL, so a custom domain later is a one-line edit. A project
# with a missing row simply shows nothing for it; no dead links are drawn
# (tools/check-links.mjs answers 200 for every URL here).
[extra.links.colophon]
website = "https://colophon.404human.dev"
docs = "https://docs.colophon.404human.dev"
source = "https://github.com/akira-shirase-oss/colophon-cms"
[extra.links.service-monitor]
source = "https://github.com/akira-shirase-oss/monitoring-service"
